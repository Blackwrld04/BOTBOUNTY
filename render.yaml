services:
  - type: web
    name: botbounty-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4050"
      - key: BOT_RPC_URL
        value: https://rpc.botchain.ai
      - key: BOT_CHAIN_ID
        value: "677"
      - key: BOT_MAINNET_RPC_URL
        value: https://rpc.botchain.ai
      - key: BOT_MAINNET_CHAIN_ID
        value: "677"
      - key: ESCROW_CONTRACT_ADDRESS
        value: "0x909661b453bBe13Ee247551754b35370557A9aA2"
      - key: USDT_ADDRESS
        value: "0xaBabc7Ddc03e501d190C676BF3d92ef0e6e87a3C"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "BotBounty <no-reply@botbounty.ai>"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: "https://botbounty-theta.vercel.app"
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
