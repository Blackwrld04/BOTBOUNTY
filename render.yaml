services:
  - type: web
    name: botbounty-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4050"
      - key: BOT_RPC_URL
        value: https://rpc.bohr.life
      - key: BOT_CHAIN_ID
        value: "968"
      - key: BOT_MAINNET_RPC_URL
        value: https://rpc.botchain.ai
      - key: BOT_MAINNET_CHAIN_ID
        value: "677"
      - key: ESCROW_CONTRACT_ADDRESS
        value: "0xB128F2f442554B6517D779788F28F2EB2612164A"
      - key: USDT_ADDRESS
        value: "0x75edC9335175Fc0552D51D48439F229c10420fe3"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "BotBounty <no-reply@botbounty.ai>"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: "https://botbounty-theta.vercel.app"
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
