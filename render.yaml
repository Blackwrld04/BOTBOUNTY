services:
  - type: web
    name: botbounty-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4050"
      - key: BOT_RPC_URL
        value: https://rpc.bohr.life
      - key: BOT_CHAIN_ID
        value: "968"
      - key: BOT_MAINNET_RPC_URL
        value: https://rpc.botchain.ai
      - key: BOT_MAINNET_CHAIN_ID
        value: "677"
      - key: FACILITATOR_PRIVATE_KEY
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        value: "0x909661b453bBe13Ee247551754b35370557A9aA2"
      - key: USDT_ADDRESS
        value: "0x75edC9335175Fc0552D51D48439F229c10420fe3"
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLIENT_URL
        value: "https://botbounty.vercel.app"
      - key: EMAIL_RELAY_SECRET
        value: "botbounty-relay-auth-2026"
      - key: ADMIN_EMAILS
        value: "olajideabdulquadri22@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
